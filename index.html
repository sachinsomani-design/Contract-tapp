<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contract Expiry Tracker</title>
  <style>
    :root {
      --bg: #f5f3ef;
      --panel: rgba(255, 255, 255, 0.98);
      --card: #ffffff;
      --border: rgba(17, 24, 39, 0.08);
      --text: #20252d;
      --text-soft: #5d6673;
      --primary: #4b5563;
      --primary-dark: #2f3742;
      --danger: #8a1f1f;
      --warning: #8b6a1c;
      --success: #2e6d47;
      --shadow: 0 8px 18px rgba(17, 24, 39, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, "Segoe UI", sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 24px;
    }

    .dashboard { max-width: 1200px; margin: 0 auto; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .topbar h1 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      letter-spacing: -0.06em;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-soft);
      font-size: 1rem;
    }

    .status-chip {
      background: rgba(17, 24, 39, 0.03);
      color: var(--primary-dark);
      border: 1px solid var(--border);
      padding: 0.7rem 1rem;
      border-radius: 999px;
      font-weight: 700;
      white-space: nowrap;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }

    .stat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .stat-box strong {
      display: block;
      font-size: 2rem;
      margin-top: 6px;
    }

    .stat-label {
      color: var(--text-soft);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .warning { border-color: rgba(251, 191, 36, 0.35); }
    .danger { border-color: rgba(248, 113, 113, 0.35); }

    .main-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 22px;
      align-items: start;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: var(--text);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      background: #f8f7f5;
      border: 1px solid var(--border);
      color: var(--text-soft);
      padding: 0.75rem 0.9rem;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #f1f0ee;
      color: var(--text);
      border-color: rgba(17, 24, 39, 0.12);
    }

    .reminder-box {
      display: grid;
      gap: 10px;
      background: rgba(148, 163, 184, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    form {
      display: grid;
      gap: 16px;
    }

    .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
    label {
      font-size: 0.8rem;
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, select, textarea {
      width: 100%;
      background: #faf9f7;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 0.8rem 0.9rem;
      outline: none;
      font-size: 0.96rem;
      resize: vertical;
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(17, 24, 39, 0.2);
      box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.04);
    }

    input::placeholder, textarea::placeholder { color: #7789ad; }

    button {
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.2s ease, background 0.2s ease;
    }

    button:hover { transform: translateY(-1px); }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #ffffff;
      padding: 0.9rem 1rem;
      box-shadow: none;
    }

    .btn-secondary {
      background: rgba(148, 163, 184, 0.12);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.75rem 0.9rem;
      min-height: 42px;
    }

    .btn-danger {
      background: rgba(248, 113, 113, 0.08);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.4);
      padding: 0.35rem 0.6rem;
      font-size: 0.8rem;
    }

    .btn-cal {
      background: rgba(107, 114, 128, 0.08);
      color: var(--text);
      border: 1px solid rgba(107, 114, 128, 0.28);
      padding: 0.35rem 0.6rem;
      font-size: 0.8rem;
      margin-right: 0.4rem;
    }

    .btn-reminder {
      background: rgba(31, 122, 74, 0.08);
      color: var(--success);
      border: 1px solid rgba(31, 122, 74, 0.28);
      padding: 0.35rem 0.6rem;
      font-size: 0.8rem;
      margin-right: 0.4rem;
    }

    .btn-calendar {
      background: rgba(107, 114, 128, 0.08);
      color: var(--primary-dark);
      border: 1px solid rgba(107, 114, 128, 0.25);
      padding: 0.35rem 0.6rem;
      font-size: 0.8rem;
      margin-right: 0.4rem;
    }

    .alert-list {
      display: grid;
      gap: 12px;
    }

    .alert-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: rgba(148, 163, 184, 0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .alert-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .alert-meta strong { font-size: 0.96rem; }
    .muted { color: var(--text-soft); font-size: 0.82rem; }

    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .toolbar-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .toolbar-group input, .toolbar-group select { min-width: 180px; }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      padding: 14px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      text-align: left;
      word-break: break-word;
    }

    th {
      font-size: 0.76rem;
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .badge {
      display: inline-block;
      padding: 0.42rem 0.7rem;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-critical { background: rgba(248, 113, 113, 0.12); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.4); }
    .badge-warning { background: rgba(251, 191, 36, 0.12); color: var(--warning); border: 1px solid rgba(251, 191, 36, 0.4); }
    .badge-ok { background: rgba(52, 211, 153, 0.12); color: var(--success); border: 1px solid rgba(52, 211, 153, 0.4); }

    .attachment-box {
      display: grid;
      gap: 10px;
      background: rgba(148, 163, 184, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .attachment-list {
      display: grid;
      gap: 8px;
      color: var(--text-soft);
      font-size: 0.85rem;
    }

    .attachment-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .attachment-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      color: var(--text-soft);
      padding: 18px 0;
    }

    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
      .card { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="topbar">
      <div>
        <h1>Contract Expiry Tracker</h1>
        <p class="subtitle">Track renewal dates, renewals due soon, and export reminder alerts.</p>
      </div>
      <div class="status-chip">Live monitoring</div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="main-grid">
      <div class="card">
        <h2>Add Contract</h2>
        <div class="tabs">
          <button type="button" class="tab-btn active" data-tab="details">Details</button>
          <button type="button" class="tab-btn" data-tab="attachments">Attachments</button>
          <button type="button" class="tab-btn" data-tab="reminder">Reminder</button>
          <button type="button" class="tab-btn" data-tab="sync">Sync</button>
        </div>

        <form id="contract-form">
          <div class="tab-panel active" data-panel="details">
            <div class="form-group">
              <label for="title">Contract Name</label>
              <input type="text" id="title" placeholder="e.g., Cloud Server Lease" required />
            </div>
            <div class="form-group">
              <label for="vendor">Vendor / Partner</label>
              <input type="text" id="vendor" placeholder="e.g., AWS" required />
            </div>
            <div class="form-group">
              <label for="expiry">Expiry Date</label>
              <input type="date" id="expiry" required />
            </div>
          </div>

          <div class="tab-panel" data-panel="attachments">
            <div class="attachment-box">
              <div class="form-group">
                <label for="attachment-notes">Attachment Notes</label>
                <textarea id="attachment-notes" rows="3" placeholder="Add notes about the uploaded contract documents"></textarea>
              </div>
              <div class="form-group">
                <label for="attachment-files">Upload Files</label>
                <input id="attachment-files" type="file" multiple accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.csv,.xlsx,.txt" />
              </div>
              <div class="attachment-list" id="attachment-preview"></div>
            </div>
          </div>

          <div class="tab-panel" data-panel="reminder">
            <div class="reminder-box">
              <div class="form-group">
                <label for="reminder-to">To</label>
                <input id="reminder-to" type="email" value="legal@tractorjunction.com" readonly />
              </div>
              <div class="form-group">
                <label for="reminder-subject">Subject</label>
                <input id="reminder-subject" type="text" placeholder="Contract renewal reminder" />
              </div>
              <div class="form-group">
                <label for="reminder-message">Message</label>
                <textarea id="reminder-message" rows="5" placeholder="Please review the contract renewal status and take the necessary action."></textarea>
              </div>
              <button type="button" class="btn-primary" id="send-reminder">Open Gmail Reminder</button>
              <button type="button" class="btn-secondary" id="open-calendar-reminder">Open Google Calendar Reminder</button>
            </div>
          </div>

          <div class="tab-panel" data-panel="sync">
            <div class="reminder-box">
              <div class="form-group">
                <label for="sheet-url">Google Sheet URL</label>
                <input id="sheet-url" type="url" value="https://docs.google.com/spreadsheets/d/1ZBkrnEG-QfjnsLq9c4fIeNuroKYAvhymg4n-GF2HJVA/export?format=csv&gid=1812251719" />
              </div>
              <div class="form-group">
                <label for="sheet-gid">Sheet GID</label>
                <input id="sheet-gid" type="text" value="1812251719" placeholder="Enter gid if needed" />
              </div>
              <button type="button" class="btn-primary" id="sync-sheet-btn">Sync from Google Sheet</button>
              <button type="button" class="btn-secondary" id="preview-sheet-btn">Preview Sheet Data</button>
              <div class="muted" id="sync-status">Uses the published Google Sheet CSV export and keeps the tracker synced with the sheet data.</div>
            </div>
          </div>

          <button type="submit" class="btn-primary">Add Contract</button>
        </form>
      </div>

      <div class="card">
        <h2>Upcoming Alerts</h2>
        <div id="upcoming-list" class="alert-list"></div>
      </div>
    </div>

    <div class="card" style="margin-top: 22px;">
      <div class="action-row">
        <div class="toolbar-group">
          <input type="search" id="search-input" placeholder="Search contracts or vendors" aria-label="Search contracts" />
          <select id="status-filter" aria-label="Filter by status">
            <option value="all">All statuses</option>
            <option value="active">Active</option>
            <option value="warning">Expiring soon</option>
            <option value="critical">Expired</option>
          </select>
        </div>
        <div class="toolbar-group">
          <button class="btn-secondary" id="export-csv">Export CSV</button>
          <label class="btn-secondary" style="display:inline-flex; align-items:center; justify-content:center; cursor:pointer; padding-inline: 1rem;">
            Import CSV
            <input id="import-csv" type="file" accept=".csv,text/csv" style="display:none;" />
          </label>
          <button class="btn-secondary" id="clear-all">Clear All</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Contract</th>
            <th>Vendor</th>
            <th>Expiry Date</th>
            <th>Status</th>
            <th>Attachment</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "contract-tracker-contracts";
    const DEFAULT_SHEET_URL = "https://docs.google.com/spreadsheets/d/1ZBkrnEG-QfjnsLq9c4fIeNuroKYAvhymg4n-GF2HJVA/export?format=csv&gid=1812251719";
    const form = document.getElementById("contract-form");
    const tableBody = document.getElementById("table-body");
    const stats = document.getElementById("stats");
    const upcomingList = document.getElementById("upcoming-list");
    const searchInput = document.getElementById("search-input");
    const statusFilter = document.getElementById("status-filter");
    const exportCsvBtn = document.getElementById("export-csv");
    const importCsvInput = document.getElementById("import-csv");
    const clearAllBtn = document.getElementById("clear-all");
    const tabButtons = document.querySelectorAll(".tab-btn");
    const tabPanels = document.querySelectorAll(".tab-panel");
    const attachmentFilesInput = document.getElementById("attachment-files");
    const attachmentPreview = document.getElementById("attachment-preview");
    const attachmentNotes = document.getElementById("attachment-notes");
    const reminderSubject = document.getElementById("reminder-subject");
    const reminderMessage = document.getElementById("reminder-message");
    const sendReminderBtn = document.getElementById("send-reminder");
    const openCalendarReminderBtn = document.getElementById("open-calendar-reminder");
    const sheetUrlInput = document.getElementById("sheet-url");
    const sheetGidInput = document.getElementById("sheet-gid");
    const syncStatusEl = document.getElementById("sync-status");
    const syncSheetBtn = document.getElementById("sync-sheet-btn");
    const previewSheetBtn = document.getElementById("preview-sheet-btn");

    const LEGAL_EMAIL = "legal@tractorjunction.com";

    let attachmentDraft = [];

    function formatGoogleDate(dateString) {
      const date = new Date(dateString);
      if (Number.isNaN(date.getTime())) return new Date().toISOString().slice(0, 10).replace(/-/g, "");
      const yyyy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, "0");
      const dd = String(date.getDate()).padStart(2, "0");
      return `${yyyy}${mm}${dd}`;
    }

    function buildReminderContent(contract) {
      const status = calculateStatus(contract.expiry);
      const days = getDaysRemaining(contract.expiry);
      const statusText = days < 0 ? `expired ${Math.abs(days)} days ago` : `due in ${days} days`;

      return {
        subject: `Contract Reminder: ${contract.title} (${contract.vendor})`,
        body: [
          "Hello Legal Team,",
          "",
          `This is an automated reminder for the ${contract.title} contract with ${contract.vendor}.`,
          `Current status: ${status.label}.`,
          `Expiry date: ${contract.expiry}.`,
          `Tracker status: ${statusText}.`,
          "Recurring reminder: every 30 days.",
          "",
          "Please review the contract, confirm renewal/closure status, and take the necessary action.",
          "",
          "Regards,",
          "Contract Tracker System"
        ].join("\n")
      };
    }

    function openReminderEmail(contract) {
      const reminder = buildReminderContent(contract);
      const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(LEGAL_EMAIL)}&su=${encodeURIComponent(reminder.subject)}&body=${encodeURIComponent(reminder.body)}`;
      window.open(gmailUrl, "_blank");
    }

    function openCalendarReminder(contract) {
      const title = `${contract.title} Contract Reminder`;
      const eventDate = new Date(contract.expiry);
      const startDate = formatGoogleDate(contract.expiry);
      const endDateObj = new Date(eventDate);
      endDateObj.setDate(endDateObj.getDate() + 1);
      const endDate = formatGoogleDate(endDateObj.toISOString().slice(0, 10));
      const recurrence = "RRULE:FREQ=DAILY;INTERVAL=30";
      const details = [
        `Contract: ${contract.title}`,
        `Vendor: ${contract.vendor}`,
        `Expiry Date: ${contract.expiry}`,
        `Tracker Status: ${calculateStatus(contract.expiry).label}`,
        `Reminder sent to: ${LEGAL_EMAIL}`,
        "Recurring: Every 30 days"
      ].join("\n");

      const calendarUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&details=${encodeURIComponent(details)}&location=${encodeURIComponent("Legal Team")}&dates=${startDate}/${endDate}&addattendees=${encodeURIComponent(LEGAL_EMAIL)}&recur=${encodeURIComponent(recurrence)}&sf=true&output=xml`;
      window.open(calendarUrl, "_blank");
    }

    const defaultContracts = [
      { title: "Cloud Hosting Renewal", vendor: "AWS", expiry: "2026-09-10", attachments: [], notes: "" },
      { title: "Office Lease", vendor: "City Towers", expiry: "2026-08-18", attachments: [], notes: "" },
      { title: "Security Software", vendor: "SentinelOne", expiry: "2026-11-02", attachments: [], notes: "" }
    ];

    function normalizeContract(contract) {
      return {
        title: contract.title || "",
        vendor: contract.vendor || "",
        expiry: contract.expiry || "",
        attachments: Array.isArray(contract.attachments) ? contract.attachments : [],
        notes: contract.notes || ""
      };
    }

    let contracts = (JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultContracts).map(normalizeContract);

    function saveContracts() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(contracts));
      renderContracts();
    }

    function getDaysRemaining(dateString) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const expiry = new Date(dateString);
      return Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));
    }

    function calculateStatus(dateString) {
      const diffDays = getDaysRemaining(dateString);

      if (diffDays < 0) {
        return { label: `Expired (${Math.abs(diffDays)}d ago)`, class: "badge-critical", group: "critical" };
      }
      if (diffDays <= 30) {
        return { label: `Expiring soon (${diffDays}d left)`, class: "badge-warning", group: "warning" };
      }
      return { label: `Active (${diffDays}d left)`, class: "badge-ok", group: "active" };
    }

    function getFilteredContracts() {
      const search = searchInput.value.trim().toLowerCase();
      const selectedStatus = statusFilter.value;

      return contracts.filter((contract) => {
        const matchesSearch = !search ||
          contract.title.toLowerCase().includes(search) ||
          contract.vendor.toLowerCase().includes(search);

        if (!matchesSearch) return false;
        if (selectedStatus === "all") return true;

        return calculateStatus(contract.expiry).group === selectedStatus;
      });
    }

    function renderStats() {
      const total = contracts.length;
      const expiringSoon = contracts.filter((c) => {
        const days = getDaysRemaining(c.expiry);
        return days >= 0 && days <= 30;
      }).length;
      const expired = contracts.filter((c) => getDaysRemaining(c.expiry) < 0).length;
      const active = contracts.filter((c) => getDaysRemaining(c.expiry) > 30).length;

      stats.innerHTML = `
        <div class="stat-box">
          <span class="stat-label">Total</span>
          <strong>${total}</strong>
        </div>
        <div class="stat-box warning">
          <span class="stat-label">Expiring soon</span>
          <strong>${expiringSoon}</strong>
        </div>
        <div class="stat-box danger">
          <span class="stat-label">Expired</span>
          <strong>${expired}</strong>
        </div>
        <div class="stat-box">
          <span class="stat-label">Active</span>
          <strong>${active}</strong>
        </div>
      `;
    }

    function renderUpcomingAlerts() {
      const upcoming = [...contracts]
        .sort((a, b) => new Date(a.expiry) - new Date(b.expiry))
        .slice(0, 4);

      if (!upcoming.length) {
        upcomingList.innerHTML = '<div class="empty-state">No contracts scheduled yet.</div>';
        return;
      }

      upcomingList.innerHTML = upcoming.map((contract) => {
        const status = calculateStatus(contract.expiry);
        const days = getDaysRemaining(contract.expiry);

        return `
          <div class="alert-item">
            <div class="alert-meta">
              <strong>${contract.title}</strong>
              <span class="muted">${contract.vendor} • ${contract.expiry}</span>
            </div>
            <div class="badge ${status.class}">${days < 0 ? 'Past due' : `${days}d left`}</div>
          </div>
        `;
      }).join('');
    }

    function generateICS(title, vendor, expiryDate) {
      const safeTitle = (title || "Contract").replace(/[^a-z0-9]+/gi, "_").replace(/^_|_$/g, "") || "contract";
      const formattedDate = expiryDate.replace(/-/g, "");
      const icsData = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Contract Tracker//EN",
        "BEGIN:VEVENT",
        `UID:${safeTitle}-${Date.now()}@contract-tracker`,
        `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").split(".")[0]}Z`,
        `SUMMARY:Contract Expiry: ${title} (${vendor})`,
        `DESCRIPTION:Reminder that the contract with ${vendor} expires on ${expiryDate}.`,
        `DTSTART;VALUE=DATE:${formattedDate}`,
        `DTEND;VALUE=DATE:${formattedDate}`,
        "BEGIN:VALARM",
        "TRIGGER:-P7D",
        "ACTION:DISPLAY",
        "DESCRIPTION:Contract expiring in 7 days",
        "END:VALARM",
        "END:VEVENT",
        "END:VCALENDAR"
      ].join("\r\n");

      const blob = new Blob([icsData], { type: "text/calendar;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `${safeTitle}_reminder.ics`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentValue = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            currentValue += '"';
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          currentRow.push(currentValue);
          currentValue = "";
        } else if ((char === '\n' || char === '\r') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') i += 1;
          currentRow.push(currentValue);
          if (currentRow.some((cell) => cell.trim() !== "")) {
            rows.push(currentRow);
          }
          currentRow = [];
          currentValue = "";
        } else {
          currentValue += char;
        }
      }

      if (currentValue.length || currentRow.length) {
        currentRow.push(currentValue);
        if (currentRow.some((cell) => cell.trim() !== "")) {
          rows.push(currentRow);
        }
      }

      return rows;
    }

    function buildSheetExportUrl(rawUrl) {
      const sheetUrl = (rawUrl || DEFAULT_SHEET_URL).trim();
      if (!sheetUrl) return DEFAULT_SHEET_URL;
      if (sheetUrl.includes('/export?')) return sheetUrl;

      const gid = (sheetGidInput.value || "1812251719").trim();
      const baseUrl = sheetUrl.replace(/\/edit.*$/, '').replace(/\?.*$/, '');
      return `${baseUrl}/export?format=csv&gid=${gid}`;
    }

    function normalizeSheetContract(row) {
      const keyMap = {};
      row.forEach((value, index) => {
        keyMap[index] = value ? value.trim() : "";
      });

      const title = row.findIndex((value) => /contract|name/i.test(value)) >= 0
        ? row[row.findIndex((value) => /contract|name/i.test(value) && value)]
        : "";

      return {
        title: row[0] || "",
        vendor: row[1] || "",
        expiry: row[2] || "",
        notes: row[3] || ""
      };
    }

    async function syncFromGoogleSheet() {
      const exportUrl = buildSheetExportUrl(sheetUrlInput.value || DEFAULT_SHEET_URL);
      syncStatusEl.textContent = "Syncing from Google Sheet...";

      try {
        const response = await fetch(exportUrl, { mode: "cors" });
        if (!response.ok) throw new Error(`Google Sheet request failed: ${response.status}`);

        const csvText = await response.text();
        const rows = parseCSV(csvText);

        if (rows.length < 2) {
          throw new Error("The sheet appears empty or the export is not readable.");
        }

        const sheetRows = rows.slice(1).filter((row) => row.some((cell) => (cell || "").trim()));
        const parsedContracts = sheetRows.map((row) => {
          const values = row.map((cell) => (cell || "").trim());
          const title = values[0] || "";
          const vendor = values[1] || "";
          const expiry = values[2] || "";
          const notes = values[3] || "";

          return { title, vendor, expiry, attachments: [], notes };
        }).filter((contract) => contract.title && contract.expiry);

        if (!parsedContracts.length) {
          throw new Error("No valid contract rows were found. Please confirm the sheet fields are in the order: Contract, Vendor, Expiry Date.");
        }

        const merged = [...contracts];
        parsedContracts.forEach((contract) => {
          const key = `${contract.title}::${contract.vendor}::${contract.expiry}`;
          const existingIndex = merged.findIndex((item) => `${item.title}::${item.vendor}::${item.expiry}` === key);
          if (existingIndex >= 0) {
            merged[existingIndex] = { ...merged[existingIndex], ...contract };
          } else {
            merged.push(contract);
          }
        });

        contracts = merged;
        saveContracts();
        syncStatusEl.textContent = `Synced ${parsedContracts.length} contracts from the Google Sheet.`;
      } catch (error) {
        syncStatusEl.textContent = error.message || "Unable to sync from Google Sheet right now.";
        console.error(error);
      }
    }

    function exportCSV() {
      const rows = [
        ["title", "vendor", "expiry", "attachments"],
        ...contracts.map((contract) => [
          contract.title,
          contract.vendor,
          contract.expiry,
          (contract.attachments || []).map((file) => file.name).join("; ")
        ])
      ];

      const csvContent = rows.map((row) => row.map((value) => `"${String(value).replace(/"/g, '""')}"`).join(",")).join("\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "contracts.csv";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function importCSV(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const text = event.target.result;
        const lines = text.split(/\r?\n/).filter(Boolean);
        if (lines.length < 2) return;

        const parsed = [];
        for (let i = 1; i < lines.length; i += 1) {
          const row = lines[i].split(",").map((cell) => cell.replace(/^"|"$/g, "").replace(/""/g, '"'));
          if (row.length < 3) continue;
          const [title, vendor, expiry] = row;
          if (title && vendor && expiry) {
            parsed.push({
              title: title.trim(),
              vendor: vendor.trim(),
              expiry: expiry.trim(),
              attachments: [],
              notes: ""
            });
          }
        }

        if (!parsed.length) {
          alert("No valid contract rows were found in the CSV file.");
          return;
        }

        contracts = parsed;
        saveContracts();
      };
      reader.readAsText(file);
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({
          name: file.name,
          type: file.type,
          size: file.size,
          dataUrl: reader.result
        });
        reader.onerror = () => reject(new Error("Could not read file."));
        reader.readAsDataURL(file);
      });
    }

    function renderAttachmentPreview() {
      if (!attachmentDraft.length) {
        attachmentPreview.innerHTML = '<span class="muted">No files attached yet.</span>';
        return;
      }

      attachmentPreview.innerHTML = attachmentDraft.map((file) => `
        <div class="attachment-item">
          <a class="attachment-link" href="${file.dataUrl}" target="_blank" download="${file.name}">${file.name}</a>
          <button type="button" class="btn-danger" data-remove-file="${file.name}">Remove</button>
        </div>
      `).join("");

      attachmentPreview.querySelectorAll("[data-remove-file]").forEach((button) => {
        button.addEventListener("click", () => {
          attachmentDraft = attachmentDraft.filter((file) => file.name !== button.dataset.removeFile);
          renderAttachmentPreview();
        });
      });
    }

    function renderContracts() {
      tableBody.innerHTML = "";
      const filteredContracts = getFilteredContracts();
      filteredContracts.sort((a, b) => new Date(a.expiry) - new Date(b.expiry));
      renderStats();
      renderUpcomingAlerts();

      if (!filteredContracts.length) {
        tableBody.innerHTML = '<tr><td colspan="6" class="empty-state">No matching contracts found.</td></tr>';
        return;
      }

      filteredContracts.forEach((contract) => {
        const status = calculateStatus(contract.expiry);
        const row = document.createElement("tr");
        const index = contracts.findIndex((item) => item.title === contract.title && item.vendor === contract.vendor && item.expiry === contract.expiry);
        const attachments = Array.isArray(contract.attachments) ? contract.attachments : [];
        const attachmentMarkup = attachments.length
          ? attachments.map((file) => `
              <div>
                <a class="attachment-link" href="${file.dataUrl}" target="_blank" download="${file.name}">${file.name}</a>
              </div>
            `).join("")
          : '<span class="muted">No attachment</span>';

        row.innerHTML = `
          <td><strong>${contract.title}</strong></td>
          <td>${contract.vendor}</td>
          <td>${contract.expiry}</td>
          <td><span class="badge ${status.class}">${status.label}</span></td>
          <td>${attachmentMarkup}</td>
          <td>
            <button class="btn-reminder" onclick="openReminderEmail(${JSON.stringify(contract).replace(/'/g, "\\'")})">✉️ Mail</button>
            <button class="btn-calendar" onclick="openCalendarReminder(${JSON.stringify(contract).replace(/'/g, "\\'")})">🗓️ Calendar</button>
            <button class="btn-cal" onclick="generateICS('${contract.title.replace(/'/g, "\\'")}', '${contract.vendor.replace(/'/g, "\\'")}', '${contract.expiry}')">📅 Alert</button>
            <button class="btn-danger" onclick="deleteContract(${index})">Delete</button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    function populateReminderTemplate() {
      const contractName = document.getElementById("title").value.trim() || "Contract";
      const expiryDate = document.getElementById("expiry").value || "TBD";
      const vendor = document.getElementById("vendor").value.trim() || "Vendor";
      const days = getDaysRemaining(expiryDate) || 0;
      const relativeStatus = expiryDate ? (days < 0 ? `expired ${Math.abs(days)} days ago` : `due in ${days} days`) : "pending review";

      if (!reminderSubject.value.trim()) {
        reminderSubject.value = `Contract Renewal Reminder: ${contractName}`;
      }

      if (!reminderMessage.value.trim()) {
        reminderMessage.value = [
          "Hello Legal Team,",
          "",
          `This is an automated reminder for the ${contractName} contract with ${vendor}.`,
          `Expiry date: ${expiryDate}.`,
          `Tracker status: ${relativeStatus}.`,
          "Recurring reminder: every 30 days.",
          "",
          "Please review the document and take the necessary action.",
          "",
          "Regards,",
          "Contract Tracker System"
        ].join("\n");
      }
    }

    sendReminderBtn.addEventListener("click", () => {
      const subject = reminderSubject.value.trim() || "Contract Renewal Reminder";
      const body = reminderMessage.value.trim() || "Please review the contract status and next steps.";

      const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(LEGAL_EMAIL)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      window.open(gmailUrl, "_blank");
    });

    openCalendarReminderBtn.addEventListener("click", () => {
      const contract = {
        title: document.getElementById("title").value.trim() || "Contract",
        vendor: document.getElementById("vendor").value.trim() || "Vendor",
        expiry: document.getElementById("expiry").value || new Date().toISOString().slice(0, 10)
      };
      openCalendarReminder(contract);
    });

    syncSheetBtn.addEventListener("click", syncFromGoogleSheet);
    previewSheetBtn.addEventListener("click", () => {
      sheetUrlInput.value = sheetUrlInput.value || DEFAULT_SHEET_URL;
      syncFromGoogleSheet();
    });

    tabButtons.forEach((button) => {
      button.addEventListener("click", () => {
        tabButtons.forEach((btn) => btn.classList.toggle("active", btn === button));
        tabPanels.forEach((panel) => panel.classList.toggle("active", panel.dataset.panel === button.dataset.tab));

        if (button.dataset.tab === "reminder") {
          populateReminderTemplate();
        }
      });
    });

    attachmentFilesInput.addEventListener("change", async (event) => {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;

      for (const file of files) {
        const fileData = await readFileAsDataURL(file);
        attachmentDraft.push(fileData);
      }

      renderAttachmentPreview();
      event.target.value = "";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const newContract = {
        title: document.getElementById("title").value.trim(),
        vendor: document.getElementById("vendor").value.trim(),
        expiry: document.getElementById("expiry").value,
        attachments: attachmentDraft,
        notes: attachmentNotes.value.trim()
      };

      if (!newContract.title || !newContract.vendor || !newContract.expiry) return;

      contracts.push(newContract);
      saveContracts();
      form.reset();
      attachmentDraft = [];
      attachmentNotes.value = "";
      renderAttachmentPreview();
    });

    searchInput.addEventListener("input", renderContracts);
    statusFilter.addEventListener("change", renderContracts);
    exportCsvBtn.addEventListener("click", exportCSV);
    importCsvInput.addEventListener("change", (event) => {
      const file = event.target.files[0];
      importCSV(file);
      event.target.value = "";
    });

    clearAllBtn.addEventListener("click", () => {
      if (contracts.length && confirm("Delete all contracts?")) {
        contracts = [];
        saveContracts();
      }
    });

    window.deleteContract = function (index) {
      if (index < 0) return;
      contracts.splice(index, 1);
      saveContracts();
    };

    renderContracts();
  </script>
</body>
</html>
